name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run src/Component/Test

  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx vite build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npx vite preview --port 5173 --host
          wait-on: http://localhost:5173
          wait-on-timeout: 60
          install: false
